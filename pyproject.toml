[project]
name = "stream-tui"
version = "0.2.0"
description = "Terminal UI for discovering and streaming movie/series/anime via Stremio (Cinemeta + Torrentio) into mpv/vlc"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["tui", "streaming", "stremio", "torrentio", "cinemeta", "mpv", "anime"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console :: Curses",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "textual>=0.58",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "build", "twine"]

[project.scripts]
stream-tui = "stream_tui.cli:main"

[project.urls]
Homepage = "https://github.com/stream-tui/stream-tui"
Issues = "https://github.com/stream-tui/stream-tui/issues"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stream_tui*"]
