[project]
name = "torrentio-tui"
version = "0.4.0"
description = "Terminal UI for discovering and streaming movie/series/anime/live-tv via Stremio (Cinemeta + Torrentio/MediaFusion/Knightcrawler), IPTV, and anime sources into mpv/vlc"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
keywords = ["tui", "streaming", "stremio", "torrentio", "cinemeta", "mpv", "anime", "iptv", "live-tv"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console :: Curses",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "textual>=0.80.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "build", "twine", "ruff"]
proxy = ["pysocks"]

[project.scripts]
torrentio-tui = "torrentio_tui.cli:main"

[project.urls]
Homepage = "https://github.com/yubiiixtreme/torrentio-tui"
Repository = "https://github.com/yubiiixtreme/torrentio-tui"
Issues = "https://github.com/yubiiixtreme/torrentio-tui/issues"
Changelog = "https://github.com/yubiiixtreme/torrentio-tui/blob/main/CHANGELOG.md"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["torrentio_tui*"]

[tool.setuptools.package-data]
"*" = ["*.tcss"]

[tool.ruff]
line-length = 100
target-version = "py310"
lint.select = ["I", "UP", "C4", "T20", "PTH", "ERA", "FIX", "NPY", "PT", "RET", "SIM", "T10", "TID", "TRY"]
lint.ignore = ["TRY003"]
lint.fixable = ["ALL"]
lint.unfixable = []

[tool.ruff.lint.per-file-ignores]
"torrentio_tui/sources/example.py" = ["ERA001", "FIX002"]

[tool.ruff.lint.isort]
known-third-party = ["textual", "pytest"]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
